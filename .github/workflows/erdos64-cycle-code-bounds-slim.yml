name: Erdos64 cycle-code bounds slim verification

on:
  push:
    branches: ["ci/erdos64-cycle-code-bounds"]
    paths:
      - "lean-proof-lab/**"
      - ".github/workflows/erdos64-cycle-code-bounds-slim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-slim:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and audit on ubuntu-slim
        shell: bash
        run: |
          set -Eeuo pipefail
          cd lean-proof-lab
          mkdir -p artifacts-slim
          LOG="$PWD/artifacts-slim/commands.log"
          : > "$LOG"
          run_logged() {
            local command="$1"
            printf '$ %s\n' "$command" | tee -a "$LOG"
            set +e
            bash -o pipefail -c "$command" >> "$LOG" 2>&1
            local rc=$?
            set -e
            printf 'EXIT_CODE=%d\n' "$rc" | tee -a "$LOG"
            if (( rc != 0 )); then exit "$rc"; fi
          }
          run_logged "git rev-parse HEAD"
          run_logged "uname -a"
          run_logged "curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none"
          export PATH="$HOME/.elan/bin:$PATH"
          run_logged "lean --version"
          run_logged "lake update"
          run_logged "git -C .lake/packages/mathlib rev-parse HEAD"
          run_logged "lake exe cache get"
          SECONDS=0
          run_logged "lake build Erdos64FiniteCertificate 2>&1 | tee artifacts-slim/lake-build.out"
          BUILD_SECONDS=$SECONDS
          SECONDS=0
          run_logged "lake env lean Erdos64FiniteCertificate/CycleCodeBounds.lean 2>&1 | tee artifacts-slim/cycle-code-bounds.out"
          DIRECT_SECONDS=$SECONDS
          run_logged "if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Erdos64FiniteCertificate.lean Erdos64FiniteCertificate; then exit 1; fi"
          run_logged "if grep -q 'sorryAx' artifacts-slim/lake-build.out artifacts-slim/cycle-code-bounds.out; then exit 1; fi"
          {
            printf 'repository_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'lake_build_seconds=%s\n' "$BUILD_SECONDS"
            printf 'direct_lean_seconds=%s\n' "$DIRECT_SECONDS"
          } > artifacts-slim/RUN.txt
          sha256sum lean-toolchain lakefile.toml Erdos64FiniteCertificate.lean \
            Erdos64FiniteCertificate/FiniteCertificateBridge.lean \
            Erdos64FiniteCertificate/CycleCodeBounds.lean \
            > artifacts-slim/source.sha256
          sha256sum artifacts-slim/commands.log artifacts-slim/lake-build.out \
            artifacts-slim/cycle-code-bounds.out artifacts-slim/RUN.txt \
            > artifacts-slim/evidence.sha256
      - name: Upload slim evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos64-cycle-code-bounds-slim-evidence
          path: lean-proof-lab/artifacts-slim
          if-no-files-found: error
          retention-days: 30
