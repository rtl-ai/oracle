name: Erdos64 finite-certificate cached Lean verification

on:
  push:
    branches: ["ci/erdos64-finite-certificate-bridge"]
    paths:
      - "lean-proof-lab/**"
      - ".github/workflows/erdos64-finite-certificate-lean-action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Lean, restore Mathlib cache, and build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: lean-proof-lab
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Re-run direct checks and record exit codes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd lean-proof-lab
          mkdir -p artifacts-cached
          LOG="$PWD/artifacts-cached/commands.log"
          : > "$LOG"

          run_logged() {
            local command="$1"
            printf '$ %s\n' "$command" | tee -a "$LOG"
            set +e
            bash -o pipefail -c "$command" >> "$LOG" 2>&1
            local rc=$?
            set -e
            printf 'EXIT_CODE=%d\n' "$rc" | tee -a "$LOG"
            if (( rc != 0 )); then
              exit "$rc"
            fi
          }

          run_logged "git rev-parse HEAD"
          run_logged "lean --version"
          run_logged "lake --version"
          run_logged "git -C .lake/packages/mathlib rev-parse HEAD"
          SECONDS=0
          run_logged "lake build Erdos64FiniteCertificate 2>&1 | tee artifacts-cached/lake-build.out"
          BUILD_SECONDS=$SECONDS
          SECONDS=0
          run_logged "lake env lean Erdos64FiniteCertificate/FiniteCertificateBridge.lean 2>&1 | tee artifacts-cached/direct-lean.out"
          DIRECT_SECONDS=$SECONDS
          run_logged "if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Erdos64FiniteCertificate.lean Erdos64FiniteCertificate; then exit 1; fi"
          run_logged "if grep -q 'sorryAx' artifacts-cached/lake-build.out artifacts-cached/direct-lean.out; then exit 1; fi"

          {
            printf 'repository_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'lake_build_seconds=%s\n' "$BUILD_SECONDS"
            printf 'direct_lean_seconds=%s\n' "$DIRECT_SECONDS"
          } > artifacts-cached/RUN.txt

          sha256sum \
            lean-toolchain lakefile.toml \
            Erdos64FiniteCertificate.lean \
            Erdos64FiniteCertificate/FiniteCertificateBridge.lean \
            > artifacts-cached/source.sha256
          sha256sum artifacts-cached/commands.log artifacts-cached/lake-build.out \
            artifacts-cached/direct-lean.out artifacts-cached/RUN.txt \
            > artifacts-cached/evidence.sha256

      - name: Upload cached-path evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos64-finite-certificate-cached-evidence
          path: lean-proof-lab/artifacts-cached
          if-no-files-found: error
          retention-days: 30
