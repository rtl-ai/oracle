name: Erdos64 executable rooted-block reduction

on:
  push:
    branches: ["ci/erdos64-executable-block-reduction"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Decode pinned source and execute both reduction directions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p erdos64-block-reduction-work
          base64 -d ci/erdos64-block-reduction-src.tar.gz.b64 > erdos64-block-reduction-src.tar.gz
          echo '3983afe4a21baab692dbfb14369d5f8d60eff7a39496e44a5c514a8760e6ab7f  erdos64-block-reduction-src.tar.gz' | sha256sum -c -
          tar -xzf erdos64-block-reduction-src.tar.gz -C erdos64-block-reduction-work
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nauty
          export GENG_BIN=$(command -v geng || command -v nauty-geng)
          export FORWARD_MAX_N=9
          export REVERSE_MAX_N=8
          cd erdos64-block-reduction-work
          bash search/run_block_reduction.sh "$GITHUB_WORKSPACE/erdos64-block-reduction-artifacts"
      - name: Upload exact execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos64-executable-block-reduction
          path: erdos64-block-reduction-artifacts
          if-no-files-found: error
          retention-days: 30
