name: Erdos64 executable rooted-block reduction

on:
  push:
    branches: ["ci/erdos64-executable-block-reduction"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Decode pinned source and execute both reduction directions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p erdos64-block-reduction-work
          git show 491ad90ff46f3539be89503db350eb6909b7f290:ci/erdos64-block-reduction-src.tar.gz.b64 \
            | base64 -d > erdos64-block-reduction-src.tar.gz
          echo '3983afe4a21baab692dbfb14369d5f8d60eff7a39496e44a5c514a8760e6ab7f  erdos64-block-reduction-src.tar.gz' | sha256sum -c -
          tar -xzf erdos64-block-reduction-src.tar.gz -C erdos64-block-reduction-work
          cp ci/erdos64-block-reduction-src.tar.gz.b64 \
            erdos64-block-reduction-work/search/run_block_reduction.sh
          echo 'b9bbfb28f3998ed1be28a93a3bb363a88101efe1f6d677f92b00b2d390473a50  erdos64-block-reduction-work/search/run_block_reduction.sh' | sha256sum -c -
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nauty
          export GENG_BIN=$(command -v geng || command -v nauty-geng)
          export FORWARD_MAX_N=9
          export REVERSE_MAX_N=8
          export FORWARD_AUDIT_MAX_N=9
          export SOURCE_REPOSITORY=rtl-ai/erdos-64-power2-cycle-lab
          export SOURCE_COMMIT=37a6756c2603e196dd53a21fa98665c56af2ef29
          cd erdos64-block-reduction-work
          bash search/run_block_reduction.sh "$GITHUB_WORKSPACE/erdos64-block-reduction-artifacts"
      - name: Verify relocatable evidence manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cd erdos64-block-reduction-artifacts
          sha256sum -c SHA256SUMS.txt
      - name: Upload exact execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos64-executable-block-reduction-v2
          path: erdos64-block-reduction-artifacts
          if-no-files-found: error
          retention-days: 30
