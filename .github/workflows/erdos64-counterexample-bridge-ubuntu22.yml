name: Erdos64 exact counterexample bridge Ubuntu 22

on:
  push:
    branches: ["ci/erdos64-cycle-code-walk-equiv"]
    paths:
      - "lean-proof-lab/**"
      - ".github/workflows/erdos64-counterexample-bridge-ubuntu22.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erdos64-counterexample-bridge-ubuntu22
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile exact finite counterexample bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          cd lean-proof-lab
          mkdir -p artifacts-counterexample-bridge
          LOG="$PWD/artifacts-counterexample-bridge/commands.log"
          : > "$LOG"
          run_logged() {
            local command="$1"
            printf '$ %s\n' "$command" | tee -a "$LOG"
            set +e
            bash -o pipefail -c "$command" >> "$LOG" 2>&1
            local rc=$?
            set -e
            printf 'EXIT_CODE=%d\n' "$rc" | tee -a "$LOG"
            if (( rc != 0 )); then exit "$rc"; fi
          }
          run_logged "git rev-parse HEAD"
          run_logged "curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none"
          export PATH="$HOME/.elan/bin:$PATH"
          run_logged "elan toolchain install leanprover/lean4:v4.27.0"
          run_logged "elan default leanprover/lean4:v4.27.0"
          run_logged "lean --version"
          run_logged "lake --version"
          run_logged "lake update"
          run_logged "git -C .lake/packages/mathlib rev-parse HEAD"
          run_logged "lake exe cache get"
          run_logged "lake build Erdos64FiniteCertificate 2>&1 | tee artifacts-counterexample-bridge/lake-build.out"
          run_logged "lake env lean Erdos64FiniteCertificate/CounterexampleBridge.lean 2>&1 | tee artifacts-counterexample-bridge/direct.out"
          run_logged "if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Erdos64FiniteCertificate.lean Erdos64FiniteCertificate; then exit 1; fi"
          run_logged "if grep -q 'sorryAx' artifacts-counterexample-bridge/lake-build.out artifacts-counterexample-bridge/direct.out; then exit 1; fi"
          printf 'repository_commit=%s\noverall_exit_code=0\n' "$GITHUB_SHA" > artifacts-counterexample-bridge/RUN.txt
          sha256sum lean-toolchain lakefile.toml Erdos64FiniteCertificate.lean \
            Erdos64FiniteCertificate/FiniteCertificateBridge.lean \
            Erdos64FiniteCertificate/CycleCodeBounds.lean \
            Erdos64FiniteCertificate/CycleCodeWalkEquiv.lean \
            Erdos64FiniteCertificate/CounterexampleBridge.lean \
            > artifacts-counterexample-bridge/source.sha256
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos64-counterexample-bridge-ubuntu22-evidence
          path: lean-proof-lab/artifacts-counterexample-bridge
          if-no-files-found: error
          retention-days: 30
