name: Erdos64 Lean live build 20260808

on:
  push:
    branches: ["ci/erdos64-lean-live-20260808"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Lean toolchain and run lake build
        shell: bash
        run: |
          set -Eeuo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/lean-live/evidence"
          LOG="$EVIDENCE/commands.log"
          mkdir -p "$EVIDENCE"
          : > "$LOG"

          run_cmd() {
            printf '$' | tee -a "$LOG"
            printf ' %q' "$@" | tee -a "$LOG"
            printf '\n' | tee -a "$LOG"
            set +e
            "$@" > >(tee -a "$LOG") 2> >(tee -a "$LOG" >&2)
            rc=$?
            set -e
            printf 'EXIT_CODE=%s\n' "$rc" | tee -a "$LOG"
            return "$rc"
          }

          run_cmd curl -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh \
            -o "$EVIDENCE/elan-init.sh"
          printf 'ELAN_INSTALLER_SHA256=' | tee -a "$LOG"
          sha256sum "$EVIDENCE/elan-init.sh" | tee -a "$LOG"
          run_cmd sh "$EVIDENCE/elan-init.sh" -y --default-toolchain none
          source "$HOME/.elan/env"
          run_cmd elan toolchain install leanprover/lean4:v4.27.0
          run_cmd elan default leanprover/lean4:v4.27.0
          run_cmd lean --version
          run_cmd lake --version

          cd "$GITHUB_WORKSPACE/lean-live/project"
          printf 'SOURCE_SHA256\n' | tee -a "$LOG"
          find . -type f -not -path './.lake/*' -print0 \
            | sort -z | xargs -0 sha256sum | tee "$EVIDENCE/source.sha256" | tee -a "$LOG"

          run_cmd lake update
          run_cmd lake exe cache get
          run_cmd lake build
          run_cmd lake env lean Erdos64FiniteCertificate/FiniteCertificateBridge.lean

          printf '$ source scan for sorry/admit/new axiom declarations in project sources\n' | tee -a "$LOG"
          set +e
          grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' \
            --include='*.lean' Erdos64FiniteCertificate.lean Erdos64FiniteCertificate \
            > "$EVIDENCE/source-scan.txt"
          scan_rc=$?
          set -e
          if [[ $scan_rc -eq 0 ]]; then
            cat "$EVIDENCE/source-scan.txt" | tee -a "$LOG"
            printf 'EXIT_CODE=1\n' | tee -a "$LOG"
            exit 1
          elif [[ $scan_rc -eq 1 ]]; then
            printf 'no sorry/admit/new axiom declaration found in project sources\nEXIT_CODE=0\n' | tee -a "$LOG"
          else
            printf 'grep failed with exit %s\nEXIT_CODE=%s\n' "$scan_rc" "$scan_rc" | tee -a "$LOG"
            exit "$scan_rc"
          fi

          if grep -RIn 'sorryAx' "$EVIDENCE"; then
            printf 'sorryAx found in evidence\nEXIT_CODE=1\n' | tee -a "$LOG"
            exit 1
          fi
          printf 'sorryAx absent from evidence\nEXIT_CODE=0\n' | tee -a "$LOG"

          {
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'lake_build_exit_code=0\n'
            printf 'direct_lean_exit_code=0\n'
            printf 'source_scan_exit_code=0\n'
            printf 'overall_exit_code=0\n'
          } > "$EVIDENCE/RUN.txt"
          find "$EVIDENCE" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE/SHA256SUMS.txt"

      - name: Upload Lean build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos64-lean-live-20260808
          path: lean-live/evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
