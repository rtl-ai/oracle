name: Erdos64 rooted n18 ubuntu-slim front gaps retired

on:
  push:
    branches: ["ci/erdos64-rooted-n18-macos-256-v1"]
    paths:
      - ".github/workflows/erdos64-rooted-n18-ubuntu-slim-front-gaps-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erdos64-rooted-n18-ubuntu-slim-front-gaps-v1
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-slim
    steps:
      - name: Record why no duplicate search is needed
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'Residues 20-35 and 164-179 were recovered from audited artifacts' \
            '9015764187 and 9015751639; duplicate computation retired.'
