name: Erdos64 finite-certificate Lean verification

on:
  push:
    branches: ["ci/erdos64-finite-certificate-bridge"]
    paths:
      - "lean-proof-lab/**"
      - ".github/workflows/erdos64-finite-certificate-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compile and audit the certificate bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          cd lean-proof-lab
          mkdir -p artifacts
          LOG="$PWD/artifacts/commands.log"
          : > "$LOG"

          run_logged() {
            local command="$1"
            printf '$ %s\n' "$command" | tee -a "$LOG"
            set +e
            bash -o pipefail -c "$command" >> "$LOG" 2>&1
            local rc=$?
            set -e
            printf 'EXIT_CODE=%d\n' "$rc" | tee -a "$LOG"
            if (( rc != 0 )); then
              exit "$rc"
            fi
          }

          run_logged "git rev-parse HEAD"
          run_logged "curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none"
          export PATH="$HOME/.elan/bin:$PATH"
          run_logged "lean --version"
          run_logged "lake --version"
          run_logged "lake update"
          run_logged "git -C .lake/packages/mathlib rev-parse HEAD"
          run_logged "lake exe cache get"

          SECONDS=0
          run_logged "lake build Erdos64FiniteCertificate 2>&1 | tee artifacts/lake-build.out"
          BUILD_SECONDS=$SECONDS
          SECONDS=0
          run_logged "lake env lean Erdos64FiniteCertificate/FiniteCertificateBridge.lean 2>&1 | tee artifacts/finite-certificate-bridge.out"
          BRIDGE_SECONDS=$SECONDS
          SECONDS=0
          run_logged "lake env lean Erdos64FiniteCertificate/CycleCodeBounds.lean 2>&1 | tee artifacts/cycle-code-bounds.out"
          BOUNDS_SECONDS=$SECONDS

          run_logged "if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' Erdos64FiniteCertificate.lean Erdos64FiniteCertificate; then exit 1; fi"
          run_logged "if grep -q 'sorryAx' artifacts/lake-build.out artifacts/finite-certificate-bridge.out artifacts/cycle-code-bounds.out; then exit 1; fi"

          {
            printf 'repository_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'lake_build_seconds=%s\n' "$BUILD_SECONDS"
            printf 'bridge_direct_seconds=%s\n' "$BRIDGE_SECONDS"
            printf 'bounds_direct_seconds=%s\n' "$BOUNDS_SECONDS"
          } > artifacts/RUN.txt

          sha256sum \
            lean-toolchain lakefile.toml \
            Erdos64FiniteCertificate.lean \
            Erdos64FiniteCertificate/FiniteCertificateBridge.lean \
            Erdos64FiniteCertificate/CycleCodeBounds.lean \
            > artifacts/source.sha256
          sha256sum artifacts/commands.log artifacts/lake-build.out \
            artifacts/finite-certificate-bridge.out \
            artifacts/cycle-code-bounds.out artifacts/RUN.txt \
            > artifacts/evidence.sha256

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos64-finite-certificate-bridge-evidence
          path: lean-proof-lab/artifacts
          if-no-files-found: error
          retention-days: 30
